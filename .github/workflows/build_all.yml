name: Publish Builds

on:
  release:
    types: [published]

jobs:
  generate-branches:
    name: Generate Branch Matrix
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch matrix from remote
        id: set-branches
        run: |
          readarray -t arr <<< "$(git ls-remote --heads origin 'mc*' | awk '{print $2}' | sed 's|refs/heads/||')"
          json="["
          first=true
          for b in "${arr[@]}"; do
            if [ -n "$b" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                json="${json},"
              fi
              # 转义双引号-理论上分支名不会包含特殊字符
              json="${json}\"${b}\""
            fi
          done
          json="${json},\"dev\"]"
          echo "branches=$json" >> $GITHUB_OUTPUT

      - name: Build and Split Artifacts
        id: build-run
        run: |
          set -euo pipefail
          echo "Processing branch: ${{ matrix.branch }}"
          echo "Detected Gradle project"
          chmod +x ./gradlew || true
          ./gradlew clean build
          
          # 获取所有有效的 jar 包（排除 dev 和 sources）
          mapfile -t ARTIFACT_ARRAY < <(ls build/libs/*.jar 2>/dev/null | grep -vE -- '-dev\.jar|-sources\.jar' || true)
          
          if [ ${#ARTIFACT_ARRAY[@]} -eq 0 ]; then
          echo "No artifact found (non -dev jar). Skipping branch."
          exit 0
          fi
          
          echo "Built artifacts:"
          printf '%s\n' "${ARTIFACT_ARRAY[@]}"
          
          # 提取共用的短版本号 (如 1.0.0)
          FIRST_FILE="${ARTIFACT_ARRAY[0]}"
          FIRST_FNAME=$(basename "$FIRST_FILE")
          SHORTER_VERSION=$(echo "$FIRST_FNAME" | sed -E 's/^[Cc]oncerto-mc[0-9\.]+-[a-zA-Z]+-//; s/\.jar//')
          echo "shorter_version=${SHORTER_VERSION}" >> $GITHUB_OUTPUT
          
          # 遍历所有文件，根据名字分类到不同的变量中
          for FILE in "${ARTIFACT_ARRAY[@]}"; do
          FNAME=$(basename "$FILE")
          VERSION_NAME="${FNAME%.jar}" # 用作展示的 Release 标题
          
          # 提取该文件支持的 MC 版本
          if echo "$FNAME" | grep -oP 'mc\K[0-9]+\.[0-9]+(\.[0-9]+)?' >/dev/null 2>&1; then
           MC_VER=$(echo "$FNAME" | grep -oP 'mc\K[0-9]+\.[0-9]+(\.[0-9]+)?')
          else
           MC_VER=$(echo "$FNAME" | sed -nE 's/.*mc([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p')
          fi
          
          # 映射对应版本 JSON
          case "$MC_VER" in
           1.16.5) GV_ARRAY='["1.16.x"]' ;;
           1.17.1) GV_ARRAY='["1.17.x"]' ;;
           1.18.2) GV_ARRAY='["1.18.x"]' ;;
           1.19.4) GV_ARRAY='["1.19.x"]' ;;
           1.20.1) GV_ARRAY='["1.20.1","1.20.2","1.20.3"]' ;;
           1.20.4) GV_ARRAY='["1.20.4","1.20.5"]' ;;
           1.20.6) GV_ARRAY='["1.20.6"]' ;;
           1.21.1) GV_ARRAY='["1.21.1","1.21.2","1.21.3"]' ;;
           1.21.4) GV_ARRAY='["1.21.4"]' ;;
           1.21.5) GV_ARRAY='["1.21.5"]' ;;
           1.21.6) GV_ARRAY='["1.21.6","1.21.7","1.21.8","1.21.9"]' ;;
           1.21.10) GV_ARRAY='["1.21.10"]' ;;
           1.21.11) GV_ARRAY='["1.21.11"]' ;;
           26.1.2) GV_ARRAY='["26.1.x"]' ;;
           *) GV_ARRAY='[]' ;;
          esac
          
          # 判断 Loader 类型并写入专属的 GITHUB_OUTPUT
          if echo "$FNAME" | grep -iq "fabric"; then
           echo "fabric_file=$FILE" >> $GITHUB_OUTPUT
           echo "fabric_gv=$GV_ARRAY" >> $GITHUB_OUTPUT
           echo "fabric_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          elif echo "$FNAME" | grep -iq "neoforge"; then
           echo "neoforge_file=$FILE" >> $GITHUB_OUTPUT
           echo "neoforge_gv=$GV_ARRAY" >> $GITHUB_OUTPUT
           echo "neoforge_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          elif echo "$FNAME" | grep -iq "paper"; then
           echo "paper_file=$FILE" >> $GITHUB_OUTPUT
           echo "paper_gv=$GV_ARRAY" >> $GITHUB_OUTPUT
           echo "paper_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          fi
          done

      # --- 分开上传: Fabric ---
      - name: Publish Fabric to Modrinth
        if: steps.build-run.outputs.fabric_file != ''
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: A0VZd1kW
          name: ${{ steps.build-run.outputs.fabric_name }}
          version: ${{ steps.build-run.outputs.shorter_version }}-fabric
          changelog: ${{ github.event.release.body }}
          loaders: '["fabric"]'
          game-versions: ${{ steps.build-run.outputs.fabric_gv }}
          files: ${{ steps.build-run.outputs.fabric_file }}

      # --- 分开上传: NeoForge ---
      - name: Publish NeoForge to Modrinth
        if: steps.build-run.outputs.neoforge_file != ''
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: A0VZd1kW
          name: ${{ steps.build-run.outputs.neoforge_name }}
          version: ${{ steps.build-run.outputs.shorter_version }}-neoforge
          changelog: ${{ github.event.release.body }}
          loaders: '["neoforge"]'
          game-versions: ${{ steps.build-run.outputs.neoforge_gv }}
          files: ${{ steps.build-run.outputs.neoforge_file }}

      # --- 分开上传: Paper ---
      - name: Publish Paper to Modrinth
        if: steps.build-run.outputs.paper_file != ''
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: A0VZd1kW
          name: ${{ steps.build-run.outputs.paper_name }}
          version: ${{ steps.build-run.outputs.shorter_version }}-paper
          changelog: ${{ github.event.release.body }}
          loaders: '["paper"]'
          game-versions: ${{ steps.build-run.outputs.paper_gv }}
          files: ${{ steps.build-run.outputs.paper_file }}

      # --- 总结报告 ---
      - name: Summary
        run: |
          echo "### Build & Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Version**: ${{ steps.build-run.outputs.shorter_version }}" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.build-run.outputs.fabric_file }}" ]; then
            echo "- **Fabric**: Uploaded ${{ steps.build-run.outputs.fabric_name }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ steps.build-run.outputs.neoforge_file }}" ]; then
            echo "- **NeoForge**: Uploaded ${{ steps.build-run.outputs.neoforge_name }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ steps.build-run.outputs.paper_file }}" ]; then
            echo "- **Paper**: Uploaded ${{ steps.build-run.outputs.paper_name }}" >> $GITHUB_STEP_SUMMARY
          fi