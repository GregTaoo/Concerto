plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.13-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

def platforms = rootProject.enabled_platforms.split(",").toList()
platforms.add("common")

subprojects {

    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    if (platforms.contains(project.name)) {
        apply plugin: "dev.architectury.loom"

        loom {
            silentMojangMappingsLicense()
        }

        repositories {
            maven { url "https://maven.neoforged.net/releases/" }
        }

        dependencies {
            minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
            // The following line declares the mojmap mappings, you may use other mappings as well
            mappings loom.officialMojangMappings()
            // The following line declares the yarn mappings you may select this one as well.
            // mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"
    apply plugin: "com.github.johnrengelman.shadow"

    if (platforms.contains(project.name)) {
        apply plugin: "architectury-plugin"
    }

    base {
        archivesName = rootProject.archives_base_name
    }

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        // 1.20.1 players commonly run Java 17
        options.release = 17
    }

    java {
        toolchain.languageVersion.set(JavaLanguageVersion.of(21))
        withSourcesJar()
    }
}

build {
    dependsOn("buildAll")
}

tasks.register("buildAll", Copy) {
    group = "build"
    description = "Build shadow jars and collect outputs"

    def mcVersion = rootProject.minecraft_version
    def modVersion = rootProject.mod_version

    def libOut = file("$rootDir/build/libs")
    into(libOut)

    def tasksToCollect = [
            ["fabric",   "remapJar", "Concerto-mc${mcVersion}-fabric-${modVersion}.jar"],
            ["paper",    "shadowJar", "Concerto-mc${mcVersion}-paper-${modVersion}.jar"]
    ]

    tasksToCollect.each { entry ->
        def (modName, taskName, targetName) = entry

        def task = project(":${modName}").tasks.named(taskName)

        dependsOn(task)

        from(task) {
            rename { fileName -> targetName }
        }
    }
}