architectury {
    common(rootProject.enabled_platforms.split(",")) {
        it.platformPackage "neoforge", "forge"
    }
}

repositories {
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.7'
    api project(":core")
}
