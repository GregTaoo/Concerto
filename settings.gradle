pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url 'https://jitpack.io' }
        mavenCentral()
        gradlePluginPortal()
    }
}

include("core")
include("common")
include("fabric")
// no NeoForge for 1.20.1 (NeoForge starts at 1.20.2); the paper plugin needs
// Paper's brigadier/lifecycle API which only exists from 1.20.6 on

rootProject.name = "concerto"
